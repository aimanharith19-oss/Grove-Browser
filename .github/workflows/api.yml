name: api
on: { workflow_dispatch: {} }
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "current" }
      - run: gradle :app:dependencies --configuration releaseRuntimeClasspath > /dev/null; gradle :app:compileReleaseKotlin -q || true
      - run: |
          aar=$(find ~/.gradle/caches -name "geckoview-*.aar" | head -1); echo $aar
          mkdir x && cd x && unzip -q $aar classes.jar && unzip -q classes.jar
          for c in 'PanZoomController' 'PanZoomController$InputResultDetail' 'ContentBlocking$Delegate' 'ContentBlocking$BlockEvent' 'MediaSession$Metadata' 'MediaSession$Image' 'MediaSession' 'GeckoSession$ScrollDelegate' 'GeckoSession$Loader' 'GeckoSessionSettings' 'GeckoSessionSettings$Builder' 'GeckoView' 'Autofill$Delegate' 'ContentBlockingController' 'WebExtension$Port' 'GeckoSession$ContentDelegate'; do
            f=org/mozilla/geckoview/$c.class; [ -f "$f" ] && javap -cp . "org.mozilla.geckoview.${c//\$/\$}" | grep -vE "^Compiled" ; done
