name: api
on: { workflow_dispatch: {} }
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "current" }
      - run: gradle :app:dependencies --configuration releaseRuntimeClasspath > /dev/null; gradle :app:compileReleaseKotlin -q || true
      - run: |
          aar=$(find ~/.gradle/caches -name "geckoview-*.aar" | head -1); echo $aar
          mkdir x && cd x && unzip -q $aar classes.jar && unzip -q classes.jar
          for c in 'WebExtensionController$PromptDelegate' 'WebExtensionController' 'WebExtension$ActionDelegate' 'WebExtension$Action' 'WebExtension$MetaData' 'GeckoSession$MediaSession$Delegate' 'MediaSession$Delegate' 'MediaSession' 'GeckoSession$ContentDelegate' 'GeckoRuntimeSettings' 'WebExtension$PortDelegate' 'WebExtension$MessageDelegate' 'WebExtension$Port' 'GeckoSession$PromptDelegate$PromptInstanceDelegate' 'WebExtensionController$AddonManagerDelegate' 'GeckoSessionSettings'; do
            f=org/mozilla/geckoview/$c.class; [ -f "$f" ] && javap -cp . "org.mozilla.geckoview.${c//\$/\$}" | grep -vE "^Compiled" ; done
