name: smoke
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "current" }
      - name: Bundle uBlock Origin
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh api repos/gorhill/uBlock/releases --jq '[.[] | select(.prerelease|not) | .assets[] | select(.name|endswith(".firefox.signed.xpi"))][0].browser_download_url')
          curl -fsSL "$url" -o app/src/main/assets/ubo.xpi
          unzip -tq app/src/main/assets/ubo.xpi
      - name: Bundle Readability (reader view)
        run: |
          npm pack @mozilla/readability@0.6.0 --silent
          tar -xzOf mozilla-readability-0.6.0.tgz package/Readability.js > app/src/main/assets/helper/Readability.js
          rm mozilla-readability-0.6.0.tgz
          test -s app/src/main/assets/helper/Readability.js
      - run: gradle assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-x86_64-release.apk
            adb logcat -c
            adb shell am start -n app.grove.browser/.MainActivity
            sleep 40
            adb shell am start -a android.intent.action.VIEW -d https://example.com app.grove.browser
            sleep 25
            adb logcat -d > logcat.txt || true
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screen.png || true
            grep -n -A40 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -120 || true
            grep -E " (I|W) Grove" logcat.txt | head -20 || true
            ! grep -q "FATAL EXCEPTION" logcat.txt
            grep -qE "uBO (installed|ready)" logcat.txt
            grep -q "helper connected" logcat.txt
            grep -q "Groveguard ready" logcat.txt
      - name: Is the page drawn? (black-screen check)
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("screen.png").convert("RGB"); w, h = im.size
          box = im.crop((w // 10, h // 4, w * 9 // 10, h * 3 // 4)).resize((80, 80))
          px = list(box.getdata()); dark = sum(1 for p in px if sum(p) < 60) / len(px)
          avg = tuple(sum(c[i] for c in px) // len(px) for i in range(3))
          print(f"screen {w}x{h} middle: average colour {avg}, dark pixels {dark:.0%}")
          open("pagecheck.txt", "w").write(f"{dark:.3f}")
          PY
          python3 -c "import sys; d=float(open('pagecheck.txt').read()); print('PAGE BLACK' if d > 0.9 else 'page drawn'); sys.exit(1 if d > 0.9 else 0)"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-logs, path: "logcat.txt\nscreen.png" }
