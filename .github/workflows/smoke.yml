name: smoke
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "current" }
      - name: Bundle uBlock Origin
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh api repos/gorhill/uBlock/releases --jq '[.[] | select(.prerelease|not) | .assets[] | select(.name|endswith(".firefox.signed.xpi"))][0].browser_download_url')
          curl -fsSL "$url" -o ubo.xpi
          d=app/src/main/assets/extensions/ublock; mkdir -p $d && unzip -q -o ubo.xpi -d $d && rm -rf $d/META-INF
      - run: gradle assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-x86_64-release.apk
            adb logcat -c
            adb shell am start -n app.grove.browser/.MainActivity
            sleep 40
            adb shell am start -a android.intent.action.VIEW -d https://example.com app.grove.browser
            sleep 25
            adb logcat -d > logcat.txt || true
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screen.png || true
            grep -n -A40 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -120 || true
            ! grep -q "FATAL EXCEPTION" logcat.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-logs, path: "logcat.txt\nscreen.png" }
