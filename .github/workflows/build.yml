name: build
on:
  push: { branches: [main], tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "current" }
      - name: Bundle uBlock Origin (built in)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh api repos/gorhill/uBlock/releases --jq '[.[] | select(.prerelease|not) | .assets[] | select(.name|endswith(".firefox.signed.xpi"))][0].browser_download_url')
          echo "uBO: $url"
          curl -fsSL "$url" -o ubo.xpi
          d=app/src/main/assets/extensions/ublock
          mkdir -p $d && unzip -q -o ubo.xpi -d $d && rm -rf $d/META-INF
          test -f $d/manifest.json
      - run: gradle assembleRelease --stacktrace
      - run: ls -la app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with: { name: grove-browser, path: app/build/outputs/apk/release/*.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/outputs/apk/release/*.apk }
