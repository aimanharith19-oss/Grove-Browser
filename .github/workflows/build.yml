name: build
on:
  push: { branches: [main], tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "current" }
      - name: Bundle uBlock Origin (built in)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh api repos/gorhill/uBlock/releases --jq '[.[] | select(.prerelease|not) | .assets[] | select(.name|endswith(".firefox.signed.xpi"))][0].browser_download_url')
          echo "uBO: $url"
          curl -fsSL "$url" -o app/src/main/assets/ubo.xpi
          unzip -tq app/src/main/assets/ubo.xpi
      - name: Signing key
        env: { KS: "${{ secrets.GROVE_KEYSTORE }}", PW: "${{ secrets.GROVE_KS_PASS }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::GROVE_KEYSTORE secret missing"; exit 1; fi
          echo "$KS" | sed 's/^GROVE_KEYSTORE *= *//' | tr -d ' \r\n' | base64 -d > $RUNNER_TEMP/grove.jks || { echo "::error::GROVE_KEYSTORE secret is not valid base64"; exit 1; }
          pw=$(printf '%s' "$PW" | sed 's/^.*= *//' | tr -d ' \r\n')
          # The keystore file (secret) is what protects Grove; its password alone is useless without it.
          keytool -list -keystore $RUNNER_TEMP/grove.jks -storepass "$pw" >/dev/null 2>&1 || pw="c220b803016a2f1120d5fc93"
          keytool -list -keystore $RUNNER_TEMP/grove.jks -storepass "$pw" >/dev/null 2>&1 || { echo "::error::GROVE_KEYSTORE secret is not the Grove key"; exit 1; }
          echo "GROVE_KS_PASS=$pw" >> $GITHUB_ENV
          echo "GROVE_KEYSTORE_FILE=$RUNNER_TEMP/grove.jks" >> $GITHUB_ENV
          echo "signing with Grove key"
      - run: gradle assembleRelease --stacktrace
      - name: APK size report
        run: |
          ls -la app/build/outputs/apk/release/
          unzip -v app/build/outputs/apk/release/app-arm64-v8a-release.apk | sort -k3 -n | tail -12
          unzip -v app/build/outputs/apk/release/app-arm64-v8a-release.apk | awk '{s+=$3} /assets\/extensions/ {u+=$3} END {print "uBO bytes:", u}'
      - uses: actions/upload-artifact@v4
        with: { name: grove-browser, path: app/build/outputs/apk/release/*.apk }
      - name: Publish APK to apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/grove-browser-arm64.apk
          cd out && git init -q -b apk && git add . && git -c user.name=ci -c user.email=ci@grove commit -qm "APK ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/outputs/apk/release/*.apk }
