name: chromium
# Grove Browser (Chromium): the newest Titanium release (open-source Chromium fork for Android with Chrome extensions,
# GPL-2.0, https://github.com/jqssun/android-titanium-browser) rebranded as Grove Browser, with Groveguard built in,
# signed with the Grove key. Runs on every push to this branch, by hand, and daily (picks up new Chromium releases).
on:
  push: { branches: [chromium] }
  workflow_dispatch:
  schedule: [{ cron: "17 3 * * *" }]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Latest Titanium release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(gh api repos/jqssun/android-titanium-browser/releases/latest --jq .tag_name)
          echo "TAG=$tag" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = schedule ] && git ls-remote --exit-code origin "refs/tags/chromium-$tag" >/dev/null; then
            echo "already built $tag"; echo "SKIP=1" >> $GITHUB_ENV; exit 0
          fi
          url=$(gh api repos/jqssun/android-titanium-browser/releases/latest --jq '.assets[] | select(.name|endswith("arm64-v8a.apk")) | .browser_download_url')
          curl -fsSL "$url" -o titanium.apk
          echo "Titanium $tag: $(stat -c %s titanium.apk) bytes"
      - name: Signing key
        if: env.SKIP != '1'
        env: { KS: "${{ secrets.GROVE_KEYSTORE }}", PW: "${{ secrets.GROVE_KS_PASS }}" }
        run: |
          echo "$KS" | sed 's/^GROVE_KEYSTORE *= *//' | tr -d ' \r\n' | base64 -d > $RUNNER_TEMP/grove.jks
          pw=$(printf '%s' "$PW" | sed 's/^.*= *//' | tr -d ' \r\n')
          keytool -list -keystore $RUNNER_TEMP/grove.jks -storepass "$pw" >/dev/null 2>&1 || pw="c220b803016a2f1120d5fc93"
          keytool -list -keystore $RUNNER_TEMP/grove.jks -storepass "$pw" >/dev/null 2>&1 || { echo "::error::not the Grove key"; exit 1; }
          echo "::add-mask::$pw"
          echo "PW=$pw" >> $GITHUB_ENV
          # the same Grove key signs the built-in Groveguard extension, so its id never changes
          keytool -importkeystore -noprompt -srckeystore $RUNNER_TEMP/grove.jks -srcstorepass "$pw" -srcalias grove -srckeypass "$pw" \
            -destkeystore $RUNNER_TEMP/k.p12 -deststoretype PKCS12 -deststorepass "$pw" -destkeypass "$pw" >/dev/null
          openssl pkcs12 -in $RUNNER_TEMP/k.p12 -nocerts -nodes -passin pass:"$pw" | openssl pkey -out $RUNNER_TEMP/key.pem
          rm $RUNNER_TEMP/k.p12
      - name: Rebrand as Grove Browser
        if: env.SKIP != '1'
        run: |
          pip install --quiet pillow
          python3 chromium/rebrand.py titanium.apk unsigned.apk chromium/groveguard $RUNNER_TEMP/key.pem chromium/icon
          rm $RUNNER_TEMP/key.pem
      - name: Align and sign
        if: env.SKIP != '1'
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -P 16 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/grove.jks --ks-pass env:PW --ks-key-alias grove --key-pass env:PW --v4-signing-enabled false --out grove-browser-chromium-arm64.apk aligned.apk
          $BT/apksigner verify --print-certs grove-browser-chromium-arm64.apk | head -3
          $BT/aapt2 dump badging grove-browser-chromium-arm64.apk | grep -E "^package|application-label:|application: label"
          $BT/aapt2 dump xmltree --file AndroidManifest.xml grove-browser-chromium-arm64.apk | grep -c jqssun || true
          $BT/zipalign -c -P 16 4 grove-browser-chromium-arm64.apk && echo aligned
          for x in r21.xml BJ.xml JP.xml; do echo "== $x"; $BT/aapt2 dump xmltree --file res/$x grove-browser-chromium-arm64.apk | head -12; done
          ls -la grove-browser-chromium-arm64.apk
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with: { name: grove-browser-chromium, path: grove-browser-chromium-arm64.apk }
      - name: Publish as a release
        if: env.SKIP != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          rel="chromium-$TAG"
          printf 'Grove Browser on the Chromium engine (%s), with Chrome extensions and Groveguard built in.\n\nBuilt from Titanium %s (GPL-2.0): https://github.com/jqssun/android-titanium-browser/tree/%s, rebranded by chromium/rebrand.py in this repository.\n' "$TAG" "$TAG" "$TAG" > notes.md
          gh release delete "$rel" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$rel" grove-browser-chromium-arm64.apk --target "$GITHUB_SHA" --title "Grove Browser (Chromium) $TAG" --notes-file notes.md
